name: DNS tunnels trial build

# Builds kumo-slip (the DNS tunnels and the SSH ones, see tools/build_slip.sh) for every system and says how big each is.
# A trial: nothing is released or uploaded anywhere but the artifacts of this run.
on:
  workflow_dispatch:
  # A workflow that is not on the main branch yet cannot be started by hand: a push of this branch starts it.
  push:
    branches: [feature/dns-tunnels]
    paths: ['.github/workflows/slip-test.yml', 'tools/build_slip.sh']

permissions:
  contents: read

jobs:
  slip:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false

      - name: Build kumo-slip for every system
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          # one clone for all the builds
          export SLIPNET_DIR="$RUNNER_TEMP/SlipNet"
          git clone --filter=blob:none --no-checkout https://github.com/anonvector/SlipNet.git "$SLIPNET_DIR"
          git -C "$SLIPNET_DIR" checkout --quiet 2ed00fd0072ad0b558e30ec6b5e8b30948f98894
          git -C "$SLIPNET_DIR" submodule update --init --depth 1 dnstt noizdns vaydns vaydns-mobile
          mkdir -p out
          bash tools/build_slip.sh windows amd64 out/windows-amd64/kumo-slip.exe
          bash tools/build_slip.sh windows arm64 out/windows-arm64/kumo-slip.exe
          bash tools/build_slip.sh linux amd64 out/linux-amd64/kumo-slip
          bash tools/build_slip.sh linux arm64 out/linux-arm64/kumo-slip
          bash tools/build_slip.sh darwin amd64 out/macos-amd64/kumo-slip
          bash tools/build_slip.sh darwin arm64 out/macos-arm64/kumo-slip
          bash tools/build_slip.sh android arm64 out/android/arm64-v8a/libslip.so
          bash tools/build_slip.sh android arm out/android/armeabi-v7a/libslip.so
          bash tools/build_slip.sh android amd64 out/android/x86_64/libslip.so

      - name: Sizes
        shell: bash
        run: |
          {
            echo '### kumo-slip sizes'
            echo
            echo '| file | bytes | MB |'
            echo '|---|---|---|'
            find out -type f | sort | while read -r f; do
              b=$(stat -c %s "$f")
              printf '| %s | %s | %s |\n' "${f#out/}" "$b" "$(awk "BEGIN{printf \"%.1f\", $b/1048576}")"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # what the files would weigh once zipped, as the installers carry them
          for f in $(find out -type f | sort); do
            gzip -9 -c "$f" > /tmp/z.gz
            printf 'gzip %s: %s MB\n' "${f#out/}" "$(awk "BEGIN{printf \"%.1f\", $(stat -c %s /tmp/z.gz)/1048576}")"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kumo-slip
          path: out
          compression-level: 0
