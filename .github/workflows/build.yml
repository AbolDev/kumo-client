name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    # A tag such as v1.0.1 also publishes a GitHub release with the files below.
    tags: ['v*']

env:
  SING_BOX: '1.13.21'
  XRAY: 'v26.10.21'

jobs:
  # Tests run next to the build instead of before it, so they no longer add to its time.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          cache: true
          pub-cache: true

      - run: flutter pub get
      - run: flutter test

  # sing-box (libbox.aar) for every Android CPU. Built once, then cached until the version changes.
  native-box:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - id: cache
        uses: actions/cache@v4
        with:
          path: native-out
          key: native-box-${{ env.SING_BOX }}-${{ hashFiles('tools/libbox_patch/**') }}-v1

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build libbox.aar for arm64, arm and x86_64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-out
          export GOTOOLCHAIN=auto
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          git clone --depth 1 --branch "v$SING_BOX" https://github.com/SagerNet/sing-box.git sb
          cp tools/libbox_patch/*.go sb/experimental/libbox/
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          export PATH="$(go env GOPATH)/bin:$PATH"
          (cd sb && gomobile bind -v -o libbox.aar \
            -target android/arm64,android/arm,android/amd64 -androidapi 23 \
            -javapkg=io.nekohasekai -libname=box -trimpath -buildvcs=false \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=$SING_BOX -X internal/godebug.defaultGODEBUG=multipathtcp=0 -s -w -buildid= -checklinkname=0" \
            -tags "with_gvisor,with_quic,with_utls,with_clash_api,with_wireguard,with_dhcp,badlinkname,tfogo_checklinkname0" \
            ./experimental/libbox)
          cp sb/libbox.aar native-out/libbox.aar

      - uses: actions/upload-artifact@v4
        with:
          name: native-box
          path: native-out
          compression-level: 0

  # Xray executables for every Android CPU (named libxray.so so Android lets the app run them).
  native-xray:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - id: cache
        uses: actions/cache@v4
        with:
          path: native-out
          key: native-xray-${{ env.XRAY }}-v1

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build Xray for arm64, arm and x86_64
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          git clone --depth 1 --branch "$XRAY" https://github.com/XTLS/Xray-core.git xray
          export GOTOOLCHAIN=go1.27.3 GOOS=android CGO_ENABLED=1
          build_xray() { # abi goarch compiler [goarm]
            mkdir -p "native-out/jniLibs/$1"
            (cd xray && GOARCH=$2 GOARM=${4:-} CC="$BIN/$3" go build -o "../native-out/jniLibs/$1/libxray.so" \
              -trimpath -buildvcs=false \
              -ldflags "-s -w -buildid= -checklinkname=0 -X github.com/xtls/xray-core/core.build=kumo" ./main)
          }
          build_xray arm64-v8a arm64 aarch64-linux-android23-clang
          build_xray armeabi-v7a arm armv7a-linux-androideabi23-clang 7
          build_xray x86_64 amd64 x86_64-linux-android23-clang
          ls -R native-out

      - uses: actions/upload-artifact@v4
        with:
          name: native-xray
          path: native-out
          compression-level: 0

  # The four APKs are built side by side, each on its own runner.
  apk:
    needs: [native-box, native-xray]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64-v8a
            args: --split-per-abi --target-platform android-arm64
            file: app-arm64-v8a-release.apk
          - name: armeabi-v7a
            args: --split-per-abi --target-platform android-arm
            file: app-armeabi-v7a-release.apk
          - name: x86_64
            args: --split-per-abi --target-platform android-x64
            file: app-x86_64-release.apk
          - name: universal
            args: ''
            file: app-release.apk
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Restores Gradle's dependency and build caches faster than setup-java's cache.
      - uses: gradle/actions/setup-gradle@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          cache: true
          pub-cache: true

      # The committed copies hold arm64 only; these cover arm64, arm and x86_64.
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-out
          merge-multiple: true

      - name: Use the multi-CPU native libraries
        run: |
          cp native-out/libbox.aar android/app/libs/libbox.aar
          cp -r native-out/jniLibs/* android/app/src/main/jniLibs/

      # The release key comes from repository secrets; forks without them get a debug-signed APK.
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/kumo.jks"
            echo "KUMO_STOREFILE=$RUNNER_TEMP/kumo.jks" >> "$GITHUB_ENV"
          fi

      - run: flutter pub get
      - env:
          KUMO_STOREPASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KUMO_KEYPASSWORD: ${{ secrets.KEY_PASSWORD }}
          KUMO_KEYALIAS: ${{ secrets.KEY_ALIAS }}
        run: >
          flutter build apk --release --dart-define=KUMO_COMMIT=${{ github.sha }} ${{ matrix.args }}
          --obfuscate --split-debug-info=build/symbols --no-pub

      - run: |
          mkdir dist
          cp build/app/outputs/flutter-apk/${{ matrix.file }} dist/kumo-android-${{ matrix.name }}.apk

      # Uploaded as the bare file (no zip); the artifact takes the file's name.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/kumo-android-${{ matrix.name }}.apk
          archive: false
  # Flutter builds Windows for the CPU of the machine running it and has no x86 target, so this
  # makes the x64 installer; the ARM64 one is built by the windows-arm64 job below.
  windows:
    # Visual Studio 2022 is the newest version these Flutter releases know.
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            flutter: '3.27.4'
            target: ''
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          cache: true
          pub-cache: true

      - run: flutter pub get

      # sing-box, Xray and the wintun driver that the app runs next to kumo.exe.
      - run: ./tools/fetch_windows_core.ps1 -Arch ${{ matrix.arch }}

      - run: flutter build windows --release --dart-define=KUMO_COMMIT=${{ github.sha }} --no-pub ${{ matrix.target }}

      # One installer for the whole app: the program, the cores, the driver and an uninstaller.
      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = ((Get-Content pubspec.yaml | Select-String '^version:').Line -split '[: +]+')[1]
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DArch=${{ matrix.arch }}" installer\kumo.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }

      - uses: actions/upload-artifact@v7
        with:
          path: dist/kumo-windows-${{ matrix.arch }}-setup.exe
          archive: false

      # The same program as a folder that runs without installing. The `portable` file makes it
      # keep its data in a `data` folder beside kumo.exe (it is added after the installer is built).
      - name: Build the portable zip
        shell: pwsh
        run: |
          $src = "build\windows\${{ matrix.arch }}\runner\Release"
          New-Item -ItemType File -Path "$src\portable" -Force | Out-Null
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path "$src\*" -DestinationPath "dist\kumo-windows-${{ matrix.arch }}-portable.zip"

      - uses: actions/upload-artifact@v7
        with:
          path: dist/kumo-windows-${{ matrix.arch }}-portable.zip
          archive: false

  # Windows on ARM. Flutter builds Windows for the machine it runs on, so this needs an ARM64 runner.
  # That runner image only has Visual Studio 2026, which Flutter 3.27 (used for everything else) does not
  # know, so a newer Flutter is used here. It is a separate job and is not required by the release: if it fails, the other files are still
  # released. The program is checked to really be an ARM64 one before it is packaged.
  windows-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Flutter from source
        shell: pwsh
        run: |
          git clone --depth 1 --branch 3.44.9 https://github.com/flutter/flutter.git "$env:USERPROFILE\flutter"
          "$env:USERPROFILE\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$env:USERPROFILE\flutter\bin\flutter.bat" --version

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter doctor -v
        continue-on-error: true

      - run: ./tools/fetch_windows_core.ps1 -Arch arm64

      - name: Build
        shell: pwsh
        run: |
          flutter build windows --release --dart-define=KUMO_COMMIT=${{ github.sha }} --no-pub --target-platform windows-arm64
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'The target flag was refused; building for this machine'
            flutter build windows --release --dart-define=KUMO_COMMIT=${{ github.sha }} --no-pub
            if ($LASTEXITCODE -ne 0) { throw 'flutter build failed' }
          }
          Get-ChildItem build\windows -Directory | Select-Object Name

      # Finds the program folder and refuses to go on unless kumo.exe is an ARM64 binary.
      - name: Check the build is ARM64
        shell: pwsh
        run: |
          $exe = Get-ChildItem build\windows -Recurse -Filter kumo.exe | Select-Object -First 1
          if (-not $exe) { throw 'kumo.exe not found' }
          $bytes = [IO.File]::ReadAllBytes($exe.FullName)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          Write-Host ("{0} machine type 0x{1:X}" -f $exe.FullName, $machine)
          if ($machine -ne 0xAA64) { throw 'kumo.exe is not an ARM64 program' }
          $release = $exe.Directory.FullName
          $want = Join-Path (Get-Location) 'build\windows\arm64\runner\Release'
          if ($release -ne $want) {
            New-Item -ItemType Directory -Force (Split-Path $want) | Out-Null
            Copy-Item $release $want -Recurse -Force
          }

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = ((Get-Content pubspec.yaml | Select-String '^version:').Line -split '[: +]+')[1]
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DArch=arm64" installer\kumo.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }

      - uses: actions/upload-artifact@v7
        with:
          path: dist/kumo-windows-arm64-setup.exe
          archive: false

      - name: Build the portable zip
        shell: pwsh
        run: |
          $src = "build\windows\arm64\runner\Release"
          New-Item -ItemType File -Path "$src\portable" -Force | Out-Null
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path "$src\*" -DestinationPath "dist\kumo-windows-arm64-portable.zip"

      - uses: actions/upload-artifact@v7
        with:
          path: dist/kumo-windows-arm64-portable.zip
          archive: false

  # Linux, for x64 and arm64: a .deb and an .rpm (the installers, which also let the core open the
  # tunnel without a password), an AppImage, and a portable tar.gz (a `portable` file makes it keep
  # its data in a folder beside it). Built on Ubuntu 22.04 so it runs on older systems too.
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev

      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          flutter-version: '3.27.4'
          cache: true
          pub-cache: true

      # Flutter publishes no prebuilt Linux arm64 SDK, so on arm64 the tagged source is cloned.
      - name: Flutter from source (arm64)
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 --branch 3.27.4 https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version

      - run: flutter config --enable-linux-desktop
      - run: flutter pub get

      # sing-box, Xray and the library NaiveProxy needs, next to the program.
      - run: bash tools/fetch_unix_core.sh linux ${{ matrix.arch }}

      - run: flutter build linux --release --dart-define=KUMO_COMMIT=${{ github.sha }} --no-pub

      - name: Package
        run: |
          arch="${{ matrix.arch }}"
          deb_arch="amd64"; [ "$arch" = arm64 ] && deb_arch="arm64"
          bundle="build/linux/$arch/release/bundle"
          mkdir -p dist stage
          cp -r "$bundle" stage/kumo
          : > stage/kumo/portable
          tar -czf "dist/kumo-linux-$arch-portable.tar.gz" -C stage kumo
          version="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          pkg="deb/kumo_${version}_${deb_arch}"
          mkdir -p "$pkg/opt/kumo" "$pkg/usr/share/applications" "$pkg/usr/share/pixmaps" "$pkg/DEBIAN"
          cp -r "$bundle/." "$pkg/opt/kumo/"
          install -m644 packaging/linux/kumo.desktop "$pkg/usr/share/applications/kumo.desktop"
          install -m644 linux/runner/resources/kumo.png "$pkg/usr/share/pixmaps/kumo.png"
          sed -e "s/@VERSION@/$version/" -e "s/@ARCH@/$deb_arch/" packaging/linux/control > "$pkg/DEBIAN/control"
          install -m755 packaging/linux/postinst "$pkg/DEBIAN/postinst"
          dpkg-deb --build --root-owner-group "$pkg" "dist/kumo-linux-$arch.deb"

      # An .rpm for Fedora, openSUSE and the like, made from the same program folder.
      - name: Package (rpm)
        run: |
          arch="${{ matrix.arch }}"
          rpm_arch="x86_64"; [ "$arch" = arm64 ] && rpm_arch="aarch64"
          bundle="build/linux/$arch/release/bundle"
          version="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          sudo apt-get install -y rpm
          mkdir -p rpmsrc rpmtop
          cp -r "$bundle" rpmsrc/bundle
          cp packaging/linux/kumo.desktop rpmsrc/kumo.desktop
          cp linux/runner/resources/kumo.png rpmsrc/kumo.png
          sed -e "s/@VERSION@/$version/" -e "s/@RPMARCH@/$rpm_arch/" packaging/linux/kumo.spec > rpmsrc/kumo.spec
          rpmbuild -bb --target "$rpm_arch" \
            --define "_topdir $PWD/rpmtop" --define "_sourcedir $PWD/rpmsrc" \
            --define "_binary_payload w9.gzdio" rpmsrc/kumo.spec
          cp rpmtop/RPMS/"$rpm_arch"/kumo-*.rpm "dist/kumo-linux-$arch.rpm"

      # An AppImage: one file that runs on most distributions (it needs GTK 3 on the system).
      - name: Package (AppImage)
        run: |
          arch="${{ matrix.arch }}"
          tool_arch="x86_64"; [ "$arch" = arm64 ] && tool_arch="aarch64"
          bundle="build/linux/$arch/release/bundle"
          mkdir -p AppDir
          cp -r "$bundle" AppDir/kumo
          install -m755 packaging/linux/AppRun AppDir/AppRun
          install -m644 packaging/linux/kumo-appimage.desktop AppDir/kumo.desktop
          install -m644 linux/runner/resources/kumo.png AppDir/kumo.png
          cp linux/runner/resources/kumo.png AppDir/.DirIcon
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$tool_arch.AppImage"
          chmod +x appimagetool
          ARCH="$tool_arch" ./appimagetool --appimage-extract-and-run --no-appstream AppDir "dist/kumo-linux-$arch.AppImage"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          path: dist/kumo-linux-${{ matrix.arch }}.deb
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: dist/kumo-linux-${{ matrix.arch }}.rpm
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: dist/kumo-linux-${{ matrix.arch }}.AppImage
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: dist/kumo-linux-${{ matrix.arch }}-portable.tar.gz
          archive: false

  # macOS: one universal app (Intel and Apple silicon) and a copy for each architecture, each as a
  # disk image (the installer: drag the app to Applications) and a portable zip (the app with a
  # `portable` file beside it, so its data stays in a folder next to it). Signed ad hoc only, so
  # macOS asks the user to allow it the first time.
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          cache: true
          pub-cache: true

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get

      # sing-box and Xray as universal binaries.
      - run: bash tools/fetch_unix_core.sh macos

      - run: flutter build macos --release --dart-define=KUMO_COMMIT=${{ github.sha }} --no-pub

      - name: Put the cores in the app, sign it and package it
        run: |
          app="build/macos/Build/Products/Release/Kumo.app"
          cp macos/core/kumo-core macos/core/kumo-xray "$app/Contents/MacOS/"
          codesign --force --deep --sign - "$app"
          mkdir -p dist work/universal
          ditto "$app" work/universal/Kumo.app

          # The one-architecture copies are made side by side, and so are the six packages.
          wait_all() { for pid in "$@"; do wait "$pid"; done; }
          bash tools/thin_macos_app.sh "$app" work/arm64/Kumo.app arm64 & arm=$!
          bash tools/thin_macos_app.sh "$app" work/x64/Kumo.app x86_64 & intel=$!
          wait_all $arm $intel

          package() {
            a="$1"
            # the disk image is the installer: the app and a shortcut to Applications
            stage="work/dmg-$a"
            mkdir -p "$stage"
            ditto "work/$a/Kumo.app" "$stage/Kumo.app"
            ln -s /Applications "$stage/Applications"
            for try in 1 2 3; do
              hdiutil create -volname "Kumo" -srcfolder "$stage" -ov -format UDZO "dist/kumo-macos-$a.dmg" && break
              sleep 5
            done
            test -f "dist/kumo-macos-$a.dmg"
            # the portable zip: the app with a marker beside it
            portable="work/portable-$a/Kumo-portable"
            mkdir -p "$portable"
            ditto "work/$a/Kumo.app" "$portable/Kumo.app"
            : > "$portable/portable"
            ditto -c -k --sequesterRsrc --keepParent "$portable" "dist/kumo-macos-$a-portable.zip"
          }
          package universal & p1=$!
          package arm64 & p2=$!
          package x64 & p3=$!
          wait_all $p1 $p2 $p3
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          path: dist/kumo-macos-universal.dmg
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: dist/kumo-macos-universal-portable.zip
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: dist/kumo-macos-arm64.dmg
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: dist/kumo-macos-arm64-portable.zip
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: dist/kumo-macos-x64.dmg
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: dist/kumo-macos-x64-portable.zip
          archive: false

  # A pushed version tag becomes a release holding the four APKs, the Windows installer and
  # portable zip, and the Linux and macOS packages.
  release:
    # The Linux, macOS and Windows ARM64 packages are added when they were built; if one of those
    # jobs fails the Android and Windows x64 files are still released.
    if: >-
      startsWith(github.ref, 'refs/tags/v') && !cancelled() &&
      needs.apk.result == 'success' && needs.windows.result == 'success' &&
      needs.test.result == 'success'
    needs: [apk, windows, windows-arm64, linux, macos, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: 'kumo-*'
          path: dist
          merge-multiple: true
          # The portable zip must stay a zip instead of being unpacked into dist/.
          skip-decompress: true

      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}"
          --title "Kumo ${{ github.ref_name }}" --generate-notes

  # After a release: refreshes the manifests in packaging/. A tag with a dash (v1.8.0-beta) is a test
  # version and is skipped. (The new version is sent to winget by hand: no token is kept here.)
  packaging:
    if: >-
      startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') &&
      needs.release.result == 'success'
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Refresh the manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh tools/packaging.ps1 -Tag "${{ github.ref_name }}"

      - name: Commit them
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Update the package manifests for ${{ github.ref_name }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
