name: iOS trial build

# A trial: builds the app for iOS without signing it, to see what in it does not build for that system. Kumo has no ios/ folder
# yet, so the project of the platform is made here (flutter create) and is not kept. Nothing is published. The log is a file
# of the run.
on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    needs: libbox
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.27.4'
          cache: true
          pub-cache: true

      # The project of the platform is in ios/; flutter create only adds what a Mac makes (the Podfile).
      - name: Make the iOS project complete
        run: |
          flutter create --platforms=ios --org app.kumo --project-name kumo .
          # mobile_scanner asks for iOS 15.5 or later.
          perl -pi -e "s/^#? ?platform :ios, '[0-9.]+'/platform :ios, '15.5'/" ios/Podfile
          grep -n "platform :ios" ios/Podfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: libbox-ios
          path: libbox-art

      - name: Put sing-box in the project and add the tunnel extension
        run: |
          set -euo pipefail
          mkdir -p ios/Libbox
          ditto -x -k libbox-art/Libbox.xcframework.zip ios/Libbox
          ls ios/Libbox
          ls ios/Libbox/Libbox.xcframework
          # xcodeproj comes with CocoaPods
          gem list xcodeproj | head -3 || true
          ruby -e 'require "xcodeproj"; puts Xcodeproj::VERSION' || gem install xcodeproj --no-document
          ruby tools/ios_add_tunnel.rb

      - run: flutter pub get

      # The .ico files of the app icons are only read on Windows.
      - run: rm -f assets/app_icons/*.ico

      - name: Build without signing
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --no-pub \
            --dart-define=KUMO_COMMIT=${{ github.sha }} --dart-define=KUMO_BUILD=kumo-ios 2>&1 | tee ios-build.log

      - name: What it made
        if: always()
        run: |
          ls -la build/ios/iphoneos 2>/dev/null || echo "no app was made"
          du -sh build/ios/iphoneos/Runner.app 2>/dev/null || true
          ls build/ios/iphoneos/Runner.app/PlugIns 2>/dev/null || echo "no extension inside"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        if: always()
        with:
          name: ios-build-log
          path: ios-build.log
          if-no-files-found: ignore

      # The project after the script, to keep it in the repository.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        if: always()
        with:
          name: ios-project-file
          path: ios/Runner.xcodeproj/project.pbxproj
          if-no-files-found: ignore
  # sing-box as a framework for iOS (what the tunnel extension links), built from the source of sing-box, with the
  # same tags the project of sing-box itself builds its Apple framework with.
  libbox:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SING_BOX: 1.13.21
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false

      - name: Fetch sing-box
        run: git clone --depth 1 --branch "v$SING_BOX" https://github.com/SagerNet/sing-box.git sb

      - name: Build the framework for iOS
        run: |
          set -euo pipefail
          cd sb
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          go run ./cmd/internal/build_libbox -target apple -platform ios 2>&1 | tail -80
          ls -la
          du -sh Libbox.xcframework

      - name: Zip it
        run: |
          cd sb
          ditto -c -k --sequesterRsrc --keepParent Libbox.xcframework ../Libbox.xcframework.zip
          ls -la ../Libbox.xcframework.zip

      # The header says what the framework offers to Swift: the Swift of the tunnel is written against it.
      - name: The header
        run: |
          h=$(find sb/Libbox.xcframework -name '*.h' -path '*ios-arm64*' | head -20)
          echo "$h"
          mkdir -p headers && cp -R $(dirname $(echo "$h" | head -1)) headers/ && ls -R headers | head -30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: libbox-ios
          path: Libbox.xcframework.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: libbox-header
          path: headers
