name: kumo
description: "Free V2ray config collector and VPN client powered by sing-box."
publish_to: 'none'
version: 1.12.2-beta.12+58

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  gal: ^2.3.1
  file_picker: ^8.1.6
  pointycastle: ^3.9.1
  ffi: ^2.1.0
  zxing2: ^0.2.3
  image: ^4.2.0
  window_manager: ^0.4.3
  tray_manager: ^0.3.2
  yaml: ^3.1.2
  country_flags: ^3.2.0
  desktop_drop: ^0.8.4
  package_info_plus: ^8.1.2
  dynamic_color: 1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Persian and Arabic are shown in Vazirmatn (SIL Open Font License, assets/fonts/OFL.txt).
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
  assets:
    - assets/npvs/
    # The ad list built into the app (ads-base.srs: HaGeZi Pro mini, made by tools/make_ad_base.py),
    # used when the lists cannot be downloaded, and the country lists of "Direct countries" (sing-geoip, sing-geosite and the Iran rules of
    # Chocolate4U), so that a connection never waits for them to download; they are refreshed later.
    - assets/rules/
    - assets/tray_icon.ico
    - assets/tray_icon.png
    # The app icons the user can pick in Settings (tools/make_app_icons.py).
    - assets/app_icons/
    # The WARP profile that is part of the app (the signed file of the repository).
    - docs/warp/profile.json
    - docs/warp/profile.json.sig

