name: kumo
description: "Free V2ray config collector and VPN client powered by sing-box."
publish_to: 'none'
version: 1.10.1+29

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  gal: ^2.3.1
  file_picker: ^8.1.6
  pointycastle: ^3.9.1
  ffi: ^2.1.0
  zxing2: ^0.2.3
  image: ^4.2.0
  window_manager: ^0.4.3
  tray_manager: ^0.3.2
  yaml: ^3.1.2
  country_flags: ^3.2.0
  desktop_drop: ^0.8.4
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/npvs/
    - assets/tray_icon.ico
    - assets/tray_icon.png

