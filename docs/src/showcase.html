<!doctype html>
<!-- Source of docs/images/banner.png (rendered by docs/src/render.ps1 with headless Chrome at 2x).

     over the screenshots here. -->
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: transparent; }
body { font-family: 'Roboto', 'Segoe UI', sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }

/* ------------------------------------------------------------ screenshots with demo values */
.shot { position: relative; overflow: hidden; transform-origin: top left; }
.shot img { position: absolute; left: 0; top: 0; display: block; }
.cover { position: absolute; display: flex; align-items: center; white-space: nowrap; }
.dot { position: relative; top: -3px; }

/* phone: 1080 x 2236 of the original 1080 x 2340 */
.phone-shot { width: 923px; height: 1968px; }
.phone-shot img { width: 923px; height: 2000px; }
.phone-shot .t { color: #49454f; }
.sb { left: 36px; top: 22px; width: 270px; height: 50px; background: rgba(217,239,222,.55); backdrop-filter: blur(9px); }
.sb .time { position: absolute; left: 130px; top: 22px; font: 500 44px 'Roboto'; color: #1c1b1f; }
.sb svg { position: absolute; top: 24px; }
.pms { font-weight: 600; color: #3f9d46; margin-right: 12px; }
.ms { font-weight: 600; color: #2f9a3d; margin-right: 6px; }
.pchip { display: inline-block; background: rgba(46, 160, 80, .18); color: #17843f; font-weight: 700;
  border-radius: 16px; padding: 0 17px; line-height: 54px; margin-right: 14px; }

/* desktop: 1430 x 930 of the original window */
.desk-shot { width: 1265px; height: 954px; }
.desk-shot img { width: 1265px; height: 954px; left: -3px; top: -1px; }
.desk-shot .t { font-family: 'Segoe UI', 'Roboto', sans-serif; }
.chip { display: inline-block; background: rgba(46, 160, 80, .17); color: #17843f; font-weight: 700;
  border-radius: 9px; padding: 0 9px; line-height: 27px; margin-right: 8px; }

/* ------------------------------------------------------------ the window and the phone */
.window-wrap { position: absolute; left: 0; top: 40px; width: 900px; height: 640px;
  filter: drop-shadow(0 22px 30px rgba(10, 60, 70, .20)) drop-shadow(0 6px 10px rgba(10, 60, 70, .12)); }
.window { position: absolute; left: 0; top: 0; width: 900px; height: 640px; border-radius: 14px 14px 0 0;
  overflow: hidden; background: #f4fbf8; box-shadow: 0 0 0 1.5px rgba(20, 70, 70, .16);
  -webkit-mask-image: linear-gradient(#000 84%, transparent 100%); mask-image: linear-gradient(#000 84%, transparent 100%); }
.window .shot { transform: translateY(-30px) scale(.7115); }

.phone { position: absolute; left: 787px; top: 0; width: 342px; padding: 7px; border-radius: 50px;
  background: linear-gradient(135deg, #f4f1ea 0%, #a9a59c 18%, #e9e5dc 38%, #8d897f 58%, #d7d3ca 80%, #9b978d 100%);
  box-shadow: 0 0 0 1px rgba(255,255,255,.6) inset, 0 0 0 1.5px rgba(60,58,52,.55), 0 60px 100px rgba(20, 50, 60, .42), 0 18px 34px rgba(20,50,60,.25); }
.phone::before, .phone::after { content: ''; position: absolute; width: 5px; background: linear-gradient(90deg, #8d897f, #d9d5cb 50%, #8d897f); border-radius: 3px; }
.phone::before { left: -4px; top: 150px; height: 64px; box-shadow: 0 86px 0 #b9b5ab; }
.phone::after { right: -4px; top: 200px; height: 96px; }
.phone .bezel { position: relative; padding: 6px; border-radius: 43px; background: #050507; box-shadow: 0 0 0 1px rgba(0,0,0,.9); }
.phone .screen { width: 316px; height: 674px; border-radius: 37px; overflow: hidden; position: relative; background: #fff; }
.phone .screen .shot { transform: scale(.3424); }
.phone .screen::after { content: ''; position: absolute; left: 50%; top: 9px; width: 13px; height: 13px;
  margin-left: -6px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #2b2f4a 0, #0a0a10 45%, #000 100%); box-shadow: 0 0 0 2px #000; }
.phone .glare { position: absolute; inset: 0; border-radius: 43px; pointer-events: none;
  background: linear-gradient(115deg, rgba(255,255,255,.20) 0%, rgba(255,255,255,0) 28%, rgba(255,255,255,0) 72%, rgba(255,255,255,.07) 100%); }
.devices { position: relative; width: 1126px; height: 700px; }

/* ------------------------------------------------------------ banner */
.banner { width: 1774px; height: 887px; position: relative; overflow: hidden;
  background:
    radial-gradient(760px 520px at 8% 12%, rgba(176, 240, 222, .85), rgba(176,240,222,0) 70%),
    radial-gradient(900px 640px at 96% 96%, rgba(207, 200, 250, .75), rgba(207,200,250,0) 72%),

.banner .icon { width: 140px; height: 140px; border-radius: 33px; display: block;
  box-shadow: 0 22px 44px rgba(20, 90, 150, .32), 0 0 0 1px rgba(255,255,255,.5) inset; }

.banner .pills { display: flex; gap: 10px; margin-top: 30px; }
.banner .pill { border: 2.5px solid #2aa876; color: #17855a; border-radius: 40px; padding: 6px 18px; font: 500 23px 'Roboto'; background: rgba(255,255,255,.55); }
.banner .devices-pos { position: absolute; left: 640px; top: 100px; transform: scale(.98); transform-origin: top left; }

.only-banner { display: none; }
body.banner-mode .only-banner { display: block; }
</style>
</head>
