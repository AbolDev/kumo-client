<!doctype html>
<!-- Source of docs/images/banner.png and docs/images/devices.png. Rendered with headless Chrome:
     see docs/src/render.ps1. The screenshots come from docs/screenshots; the host names and
     the speed figures in them are replaced here (demo values). -->
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: transparent; }
body { font-family: 'Roboto', 'Segoe UI', sans-serif; overflow: hidden; }

/* ---------------------------------------------------------------- screenshots, cleaned */
.shot { position: relative; overflow: hidden; transform-origin: top left; }
.shot img { position: absolute; left: 0; top: 0; display: block; }
.cover { position: absolute; display: flex; align-items: center; white-space: nowrap; }

/* phone: 1080 x 2236 of the original 1080 x 2340 */
.phone-shot { width: 1080px; height: 2236px; }
.phone-shot img { width: 1080px; height: 2340px; }
.phone-shot .t { font-family: 'Roboto', sans-serif; color: #49454f; }
.sb { left: 0; top: 0; width: 1080px; height: 96px; background: #ddeede; }
.sb .time { position: absolute; left: 130px; top: 22px; font: 500 44px 'Roboto'; color: #1c1b1f; }
.sb svg { position: absolute; top: 24px; }

/* desktop: 1559 x 1081, the 2 px frame cut away */
.desk-shot { width: 1555px; height: 1077px; }
.desk-shot img { width: 1559px; height: 1081px; left: -2px; top: -2px; }
.desk-shot .t { font-family: 'Segoe UI', 'Roboto', sans-serif; }

/* ---------------------------------------------------------------- device frames */
.laptop { position: relative; width: 940px; }
.laptop .lid { background: #17171b; border-radius: 30px 30px 8px 8px; padding: 16px 16px 20px; position: relative;
  box-shadow: 0 2px 0 #3a3a40 inset, 0 30px 60px rgba(30, 50, 70, .25); }
.laptop .lid::before { content: ''; position: absolute; left: 50%; top: 5px; width: 8px; height: 8px;
  margin-left: -4px; background: #2b2b33; border-radius: 50%; }
.laptop .screen { width: 908px; height: 628px; overflow: hidden; border-radius: 8px; background: #fff; position: relative; }
.laptop .screen .shot { transform: scale(.5839); }
.laptop .base { height: 22px; margin: 0 -50px; background: linear-gradient(#dadde3, #aeb3bb); border-radius: 0 0 26px 26px;
  position: relative; box-shadow: 0 18px 30px rgba(30, 50, 70, .22); }
.laptop .base::before { content: ''; position: absolute; left: 50%; top: 0; width: 170px; height: 8px;
  margin-left: -85px; background: #8f949c; border-radius: 0 0 12px 12px; }

.phone { position: relative; width: 296px; background: #0e0e12; border-radius: 64px; padding: 12px;
  box-shadow: 0 0 0 2px #3a3a42 inset, 0 30px 60px rgba(30, 50, 70, .3); }
.phone .screen { width: 272px; height: 563px; border-radius: 52px; overflow: hidden; position: relative; background: #fff; }
.phone .screen .shot { transform: scale(.2519); }
.phone .screen::after { content: ''; position: absolute; left: 50%; top: 14px; width: 14px; height: 14px;
  margin-left: -7px; border-radius: 50%; background: #0e0e12; }

.devices { position: relative; width: 1260px; height: 800px; }
.devices .laptop { position: absolute; left: 56px; top: 40px; }
.devices .phone { position: absolute; left: 918px; top: 130px; }

/* ---------------------------------------------------------------- banner */
.banner { width: 1774px; height: 887px; position: relative; overflow: hidden;
  background: radial-gradient(900px 600px at 12% 20%, #d9f6ec 0%, rgba(217,246,236,0) 70%),
              radial-gradient(900px 700px at 100% 100%, #e6e4fb 0%, rgba(230,228,251,0) 70%),
              linear-gradient(120deg, #e8f8f1, #eef7f5 50%, #ebeafa); }
.banner .rings { position: absolute; right: 120px; top: 80px; width: 900px; height: 900px; border-radius: 50%;
  border: 2px solid rgba(80, 180, 150, .18); box-shadow: 0 0 0 90px rgba(80,180,150,.05), 0 0 0 190px rgba(80,180,150,.035); }
.banner .copy { position: absolute; left: 80px; top: 170px; width: 640px; }
.banner .icon { width: 170px; height: 170px; border-radius: 40px; box-shadow: 0 18px 40px rgba(14, 100, 90, .35); display: block; }
.banner h1 { font: 900 140px 'Roboto'; color: #0f2433; letter-spacing: -3px; margin-top: 34px; line-height: 1; }
.banner .tag { font: 400 36px/1.35 'Roboto'; color: #4e5a66; margin-top: 22px; }
.banner .tag2 { font: 400 30px 'Roboto'; color: #4e5a66; margin-top: 12px; }
.banner .pills { display: flex; gap: 12px; margin-top: 34px; }
.banner .pill { border: 3px solid #25a56f; color: #1c8a5c; border-radius: 40px; padding: 8px 24px; font: 500 28px 'Roboto'; background: rgba(255,255,255,.35); }
.banner .devices { position: absolute; left: 590px; top: 70px; transform: scale(.98); transform-origin: top left; }

/* ---------------------------------------------------------------- which page */
.only-banner, .only-devices { display: none; }
body.banner-mode .only-banner { display: block; }
body.devices-mode .only-devices { display: block; }
.devices-wrap { width: 1260px; height: 800px; }
</style>
</head>
<body>

<!-- the two device mock-ups, defined once and cloned by the script below -->
<template id="devices">
  <div class="devices">
    <div class="laptop">
      <div class="lid"><div class="screen">
        <div class="shot desk-shot">
          <img src="../screenshots/desktop-connected.png">
          <!-- speed cards -->
          <div class="cover t" style="left:60px;top:600px;width:230px;height:32px;background:#e3eae7;font:500 26px 'Segoe UI';color:#1c1b1f;padding-left:4px;">2.4 MB/s</div>
          <div class="cover t" style="left:60px;top:634px;width:230px;height:22px;background:#e3eae7;font:400 18px 'Segoe UI';color:#49454f;padding-left:4px;">This session: 18.6 MB</div>
          <div class="cover t" style="left:328px;top:600px;width:230px;height:32px;background:#e3eae7;font:500 26px 'Segoe UI';color:#1c1b1f;padding-left:4px;">380 KB/s</div>
          <div class="cover t" style="left:328px;top:634px;width:230px;height:22px;background:#e3eae7;font:400 18px 'Segoe UI';color:#49454f;padding-left:4px;">This session: 3.2 MB</div>
          <!-- server card -->
          <div class="cover t" style="left:140px;top:498px;width:330px;height:32px;background:#dde4e1;justify-content:center;font:400 19px 'Segoe UI';color:#49454f;">vless · eu1.example.com:443</div>
          <!-- list rows -->
          <div class="cover t" style="left:861px;top:462px;width:200px;height:28px;padding-left:4px;background:#eff5f2;font:400 21px 'Segoe UI';color:#49454f;">cdn.example.net:443</div>
          <div class="cover t" style="left:785px;top:560px;width:260px;height:28px;padding-left:5px;background:#9ff2e2;font:400 21px 'Segoe UI';color:#49454f;"><span style="position:relative;top:-4px">·</span>&nbsp;eu1.example.com:443</div>
          <div class="cover t" style="left:786px;top:657px;width:260px;height:28px;padding-left:5px;background:#eff5f2;font:400 21px 'Segoe UI';color:#49454f;"><span style="position:relative;top:-4px">·</span>&nbsp;eu2.example.com:443</div>
          <div class="cover t" style="left:782px;top:754px;width:260px;height:28px;padding-left:5px;background:#eff5f2;font:400 21px 'Segoe UI';color:#49454f;"><span style="position:relative;top:-4px">·</span>&nbsp;us1.example.com:8880</div>
          <div class="cover t" style="left:782px;top:852px;width:260px;height:28px;padding-left:5px;background:#eff5f2;font:400 21px 'Segoe UI';color:#49454f;"><span style="position:relative;top:-4px">·</span>&nbsp;us2.example.com:8880</div>
        </div>
      </div></div>
      <div class="base"></div>
    </div>
    <div class="phone">
      <div class="screen">
        <div class="shot phone-shot">
          <img src="../screenshots/phone-connected.png">
          <div class="cover sb">
            <span class="time">9:41</span>
            <svg style="left:640px" width="64" height="48" viewBox="0 0 24 18"><path fill="#1c1b1f" d="M12 4C8.6 4 5.5 5.3 3.2 7.4L1.5 5.6C4.3 3 8 1.5 12 1.5s7.7 1.5 10.5 4.1l-1.7 1.8C18.5 5.3 15.4 4 12 4zm0 5c-2.1 0-4 .8-5.4 2.1L4.9 9.3C6.8 7.6 9.3 6.5 12 6.5s5.2 1.1 7.1 2.8l-1.7 1.8C16 9.8 14.1 9 12 9zm0 4.5c-1 0-1.9.4-2.6 1L12 17l2.6-2.5c-.7-.6-1.6-1-2.6-1z"/></svg>
            <svg style="left:722px" width="54" height="48" viewBox="0 0 20 18"><path fill="#1c1b1f" d="M1 15h3v2H1zm5-4h3v6H6zm5-4h3v10h-3zm5-5h3v15h-3z"/></svg>
            <svg style="left:792px;top:26px" width="76" height="42" viewBox="0 0 38 21"><rect x="1" y="2" width="32" height="17" rx="4.5" fill="none" stroke="#1c1b1f" stroke-width="2"/><rect x="3.6" y="4.6" width="26.8" height="11.8" rx="2.4" fill="#1c1b1f"/><rect x="34.5" y="7.5" width="3" height="6" rx="1.4" fill="#1c1b1f"/></svg>
          </div>
          <!-- server card -->
          <div class="cover t" style="left:260px;top:1038px;width:560px;height:50px;background:#dee4e2;justify-content:center;font:400 37px 'Roboto';">vless · eu1.example.com:443</div>
          <!-- speed -->
          <div class="cover t" style="left:70px;top:1222px;width:350px;height:72px;background:#e4eae8;font:500 46px 'Roboto';color:#1c1b1f;padding-left:10px;">2.4 MB/s</div>
          <div class="cover t" style="left:70px;top:1302px;width:350px;height:56px;background:#e4eae8;font:400 32px 'Roboto';padding-left:10px;">This session: 18.6 MB</div>
          <div class="cover t" style="left:580px;top:1222px;width:400px;height:72px;background:#e4eae8;font:500 46px 'Roboto';color:#1c1b1f;padding-left:11px;">380 KB/s</div>
          <div class="cover t" style="left:580px;top:1302px;width:400px;height:56px;background:#e4eae8;font:400 32px 'Roboto';padding-left:11px;">This session: 3.2 MB</div>
          <!-- list rows -->
          <div class="cover t" style="left:70px;top:1936px;width:800px;height:62px;background:#f0f5f1;font:400 38px 'Roboto';padding-left:10px;"><b style="font-weight:500;color:#43a047">148 ms</b>&nbsp;· vless + xhttp · cdn.example.net:443</div>
          <div class="cover t" style="left:70px;top:2138px;width:700px;height:62px;background:#b2f0e1;font:400 38px 'Roboto';padding-left:10px;">vless · eu1.example.com:443</div>
        </div>
      </div>
    </div>
  </div>
</template>

<div class="only-devices devices-wrap" id="devices-slot"></div>

<div class="only-banner banner">
  <div class="rings"></div>
  <div class="copy">
    <img class="icon" src="icon.webp">
    <h1>Kumo</h1>
    <p class="tag">A free, simple VPN that finds<br>working servers for you</p>
    <p class="tag2">One tap · Smart routing · No account</p>
    <div class="pills"><span class="pill">Android</span><span class="pill">Windows</span><span class="pill">macOS</span><span class="pill">Linux</span></div>
  </div>
  <div id="banner-slot"></div>
</div>

<script>
  const mode = (location.hash || '#banner').slice(1);
  document.body.classList.add(mode + '-mode');
  const tpl = document.getElementById('devices').content;
  document.getElementById(mode === 'banner' ? 'banner-slot' : 'devices-slot').appendChild(tpl.cloneNode(true));
  if (mode === 'banner') document.querySelector('#banner-slot .devices').style.cssText += 'position:absolute;left:660px;top:100px;transform:scale(.86);transform-origin:top left;';
</script>
</body>
</html>
