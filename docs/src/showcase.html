<!doctype html>
<!-- Source of docs/images/banner.png (rendered by docs/src/render.ps1 with headless Chrome at 2x).
     The screenshots live in docs/screenshots (not committed). The server names (masked like the
     app does), the speed figures, the server counts and the pings in them are demo values drawn
     over the screenshots here. -->
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: transparent; }
body { font-family: 'Roboto', 'Segoe UI', sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }

/* ------------------------------------------------------------ screenshots with demo values */
.shot { position: relative; overflow: hidden; transform-origin: top left; }
.shot img { position: absolute; left: 0; top: 0; display: block; }
.cover { position: absolute; display: flex; align-items: center; white-space: nowrap; }
.dot { position: relative; top: -3px; }

/* phone: 1080 x 2236 of the original 1080 x 2340 */
.phone-shot { width: 1080px; height: 2236px; }
.phone-shot img { width: 1080px; height: 2340px; }
.phone-shot .t { color: #49454f; }
.sb { left: 0; top: 0; width: 1080px; height: 96px; background: #ddeede; }
.sb .time { position: absolute; left: 130px; top: 22px; font: 500 44px 'Roboto'; color: #1c1b1f; }
.sb svg { position: absolute; top: 24px; }
.pms { font-weight: 600; color: #3f9d46; margin-right: 12px; }
.ms { font-weight: 600; color: #2f9a3d; margin-right: 6px; }
.pchip { display: inline-block; background: rgba(46, 160, 80, .18); color: #17843f; font-weight: 700;
  border-radius: 16px; padding: 0 17px; line-height: 54px; margin-right: 14px; }

/* desktop: 1430 x 930 of the original window */
.desk-shot { width: 1430px; height: 930px; }
.desk-shot img { width: 1559px; height: 1081px; left: -2px; top: -2px; }
.desk-shot .t { font-family: 'Segoe UI', 'Roboto', sans-serif; }
.chip { display: inline-block; background: rgba(46, 160, 80, .17); color: #17843f; font-weight: 700;
  border-radius: 9px; padding: 0 9px; line-height: 27px; margin-right: 8px; }

/* ------------------------------------------------------------ the window and the phone */
.window-wrap { position: absolute; left: 0; top: 40px; width: 900px; height: 585px;
  filter: drop-shadow(0 22px 30px rgba(10, 60, 70, .20)) drop-shadow(0 6px 10px rgba(10, 60, 70, .12)); }
.window { position: absolute; left: 0; top: 0; width: 900px; height: 585px; border-radius: 14px 14px 0 0;
  overflow: hidden; background: #f4fbf8; box-shadow: 0 0 0 1.5px rgba(20, 70, 70, .16);
  -webkit-mask-image: linear-gradient(#000 90%, transparent 100%); mask-image: linear-gradient(#000 90%, transparent 100%); }
.window .shot { transform: scale(.6294); }

.phone { position: absolute; left: 790px; top: 0; width: 336px; padding: 12px; border-radius: 46px;
  background: linear-gradient(145deg, #2a2a31, #0d0d11 40%, #17171c);
  box-shadow: 0 0 0 1.5px #55555e inset, 0 0 0 1px rgba(0,0,0,.4), 0 50px 90px rgba(20, 50, 60, .38), 0 14px 30px rgba(20,50,60,.2); }
.phone::before, .phone::after { content: ''; position: absolute; width: 4px; background: #2e2e36; border-radius: 3px; }
.phone::before { left: -4px; top: 150px; height: 70px; }
.phone::after { right: -4px; top: 190px; height: 100px; }
.phone .screen { width: 312px; height: 646px; border-radius: 34px; overflow: hidden; position: relative; background: #fff; }
.phone .screen .shot { transform: scale(.2889); }
.phone .screen::after { content: ''; position: absolute; left: 50%; top: 6px; width: 15px; height: 15px;
  margin-left: -7px; border-radius: 50%; background: #0b0b0e; box-shadow: 0 0 0 3px rgba(255,255,255,.04); }

.devices { position: relative; width: 1126px; height: 700px; }

/* ------------------------------------------------------------ banner */
.banner { width: 1774px; height: 887px; position: relative; overflow: hidden;
  background:
    radial-gradient(760px 520px at 8% 12%, rgba(176, 240, 222, .85), rgba(176,240,222,0) 70%),
    radial-gradient(900px 640px at 96% 96%, rgba(207, 200, 250, .75), rgba(207,200,250,0) 72%),
    radial-gradient(700px 500px at 62% 4%, rgba(190, 236, 244, .6), rgba(190,236,244,0) 70%),
    linear-gradient(125deg, #eaf9f3 0%, #f0f8f7 48%, #ece9fb 100%); }
.banner .rings { position: absolute; left: 930px; top: -170px; width: 1100px; height: 1100px; border-radius: 50%;
  border: 2px solid rgba(60, 170, 140, .16);
  box-shadow: 0 0 0 100px rgba(80,190,160,.035), 0 0 0 210px rgba(80,190,160,.03), 0 0 0 330px rgba(120,120,230,.025); }
.banner .copy { position: absolute; left: 88px; top: 0; height: 887px; width: 540px; display: flex; flex-direction: column; justify-content: center; }
.banner .icon { width: 140px; height: 140px; border-radius: 33px; display: block;
  box-shadow: 0 22px 44px rgba(20, 90, 150, .32), 0 0 0 1px rgba(255,255,255,.5) inset; }
.banner h1 { font: 900 144px/1 'Roboto'; color: #0e2233; letter-spacing: -4px; margin-top: 26px; }
.banner .tag { font: 500 33px/1.32 'Roboto'; color: #3b4957; margin-top: 20px; }
.banner .tag2 { font: 400 25px 'Roboto'; color: #5d6a77; margin-top: 12px; letter-spacing: .2px; }
.banner .pills { display: flex; gap: 10px; margin-top: 30px; }
.banner .pill { border: 2.5px solid #2aa876; color: #17855a; border-radius: 40px; padding: 6px 18px; font: 500 23px 'Roboto'; background: rgba(255,255,255,.55); }
.banner .devices-pos { position: absolute; left: 640px; top: 100px; transform: scale(.98); transform-origin: top left; }

.only-banner { display: none; }
body.banner-mode .only-banner { display: block; }
</style>
</head>
