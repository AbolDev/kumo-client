- **桌面。** 只會執行一個 Kumo（第二個會顯示第一個）。如果 Kumo 在連線時關閉或當機，一個小幫手會撤銷系統代理。如果無法設定系統代理（例如沒有 `gsettings` 的桌面），Kumo 會告知。在 GNOME 上視窗只會最小化，而不是隱藏到不存在的系統匣。速度與用量資料流中斷時會重新連線。在 Linux 和 macOS 上檔案僅限你自己的使用者存取，通道啟動時使用命令中直接給出的指令碼和設定。
- **更新與備份。** 安裝程式在執行前會依 GitHub 提供的 SHA-256 和大小進行校驗。備份使用更強的金鑰（15 萬輪，原為 6 萬輪）；舊備份仍可開啟。不設密碼匯出時現在會給出警告。
- **下載。** 規則集會被檢查，且不會被兩個下載同時寫入；回應為空的訂閱不再每十分鐘重試一次；下載有大小限制，提供者的回應也無法讓 Kumo 存取你本地網路中的位址。
- **Android。** 應用程式關閉時也會統計用量，並在你開啟時併入。檔案儲存更安全，並修復了兩個罕見情況下的小當機（沒有資料的憑證、僅代理模式下的重新載入）。
- **Windows。** 代理連接埠精確比較（1080 不是 10800）。

# Kumo 1.9.0

## الجديد

- **تُفحص الخوادم العامة للأمان افتراضيًا.** بعض خوادم القائمة المجانية تطلب عدم فحص شهادة TLS الخاصة بها، مما يتيح لمن في الطريق قراءة حركتك أو تغييرها. صار Kumo يفحص شهادتها دائمًا. خيار **معلومات** الجديد في قائمة *الخوادم العامة* يعرض مصدر القائمة ووقت تنزيلها وعدد الخوادم التي تطلب عدم الفحص، وفيه مفتاح للسماح بها من جديد. قد لا تتصل بعض الخوادم المجانية ذات الشهادة الموقّعة ذاتيًا بعد الآن.
- **تنزيل الاشتراكات يفحص الشهادة أيضًا.** كان إعداد *السماح بالاتصال غير الآمن* القديم مفعّلًا للجميع؛ صار الآن متوقفًا ويبدأ من جديد. إذا تعذّر التحقق من شهادة المزوّد، يخبرك Kumo ويشير إلى الإعداد.
- **حفظ أكثر أمانًا للخوادم والإعدادات على القرص.** تُحفظ الملفات كاملة أو لا تُحفظ، وتبقى آخر نسخة سليمة (`.bak`). الملف الذي لا يمكن قراءته لم يعد يُكتب فوقه: يُحفظ باسم `.broken`. ولم يعد اشتراك تالف يسقط معه البقية.
- **سطح المكتب.** تعمل نسخة واحدة فقط من Kumo (الثانية تُظهر الأولى). إذا أُغلق Kumo أو تعطّل أثناء الاتصال، يزيل مساعد صغير وكيل النظام. وإذا تعذّر ضبط وكيل النظام (مثل سطح مكتب بلا `gsettings`) يخبرك Kumo. في GNOME تُصغَّر النافذة بدل إخفائها في صينية غير موجودة. يعيد تدفق السرعة والاستهلاك الاتصال إذا انقطع. في لينكس وماك تكون الملفات لمستخدمك وحده، ويبدأ النفق بنص وإعداد يُعطيان في الأمر نفسه.
- **التحديثات والنسخ الاحتياطي.** يُفحص المثبّت قبل تشغيله بقيمة SHA-256 والحجم اللذين يقدّمهما GitHub. تستخدم النسخ الاحتياطية مفتاحًا أقوى (150 ألف جولة بدل 60 ألفًا)؛ وتفتح النسخ القديمة كما كانت. والتصدير بلا كلمة مرور يحذّر الآن.
- **التنزيلات.** تُفحص مجموعات القواعد ولا يكتب تنزيلان عليها معًا؛ ولا يُطلب اشتراك فارغ من جديد كل عشر دقائق؛ وللتنزيلات حد للحجم، ولا يمكن لرد المزوّد أن يقود Kumo إلى عناوين في شبكتك المحلية.
- **أندرويد.** يُحسب الاستهلاك والتطبيق مغلق ويُضاف عند فتحه. تُحفظ الملفات بأمان، وأُصلح عطلان صغيران في حالات نادرة (شهادة بلا بيانات، إعادة تحميل في وضع الوكيل فقط).
- **ويندوز.** يُقارن منفذ الوكيل بدقة (1080 ليس 10800).
