name: kumo
base: core24
version: '1.8.0'
summary: Free VPN client powered by sing-box and Xray
description: |
  Kumo connects to the servers and subscriptions you choose. It can run as a local proxy (also set as the system proxy) or tunnel the whole computer, and it supports many protocols, subscriptions, routing rules, ad blocking and more.
  In the Snap the tunnel cannot be opened (strict confinement): Kumo works as a local proxy.
grade: stable
confinement: strict
platforms:
  amd64:
  arm64:
apps:
  kumo:
    command: opt/kumo/kumo
    extensions: [gnome]
    plugs:
      - network
      - network-bind
      - home
parts:
  kumo:
    plugin: nil
    build-packages: [curl]
    override-build: |
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64) file=kumo-linux-x64-portable.tar.gz; sum=75d7c565d3fc0a32af7c4340b84756c82711894e234384e745fbb6ad527bf040 ;;
        arm64) file=kumo-linux-arm64-portable.tar.gz; sum=254c415d15a49a2da4ee4c75c60d2c5761c1aaeb5269eff5c425250a56406af3 ;;
      esac
      curl -fsSL -o /tmp/kumo.tgz "https://github.com/AbolDev/kumo-client/releases/download/v1.8.0/$file"
      echo "$sum  /tmp/kumo.tgz" | sha256sum -c -
      mkdir -p "$CRAFT_PART_INSTALL/opt"
      tar -xzf /tmp/kumo.tgz -C "$CRAFT_PART_INSTALL/opt"
      rm -f "$CRAFT_PART_INSTALL/opt/kumo/portable" "$CRAFT_PART_INSTALL/opt/kumo/.gitignore"
    stage-packages:
      - libayatana-appindicator3-1