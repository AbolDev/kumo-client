app-id: app.kumo.vpn
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: kumo
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # the tray icon
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-download
modules:
  - name: kumo
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/kumo
      - cp -a . /app/lib/kumo/
      - rm -f /app/lib/kumo/portable /app/lib/kumo/.gitignore
      - mkdir -p /app/bin
      - ln -s /app/lib/kumo/kumo /app/bin/kumo
      - install -Dm644 data/kumo.png /app/share/icons/hicolor/512x512/apps/app.kumo.vpn.png
      - install -Dm644 app.kumo.vpn.desktop /app/share/applications/app.kumo.vpn.desktop
      - install -Dm644 app.kumo.vpn.metainfo.xml /app/share/metainfo/app.kumo.vpn.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/AbolDev/kumo-client/releases/download/v1.10.1/kumo-linux-x64-portable.tar.gz
        sha256: 672e7afb555ffc2ef5065e964292adfbeb37f17ae26495a862538cb1708f8775
        only-arches: [x86_64]
      - type: archive
        url: https://github.com/AbolDev/kumo-client/releases/download/v1.10.1/kumo-linux-arm64-portable.tar.gz
        sha256: 66ff6f8a6d3fecf02de1260d90106041f85d047ee727c9ecbbf2dabda10b3563
        only-arches: [aarch64]
      - type: file
        path: app.kumo.vpn.desktop
      - type: file
        path: app.kumo.vpn.metainfo.xml