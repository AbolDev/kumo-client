app-id: app.kumo.vpn
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: kumo
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # the tray icon
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-download
modules:
  - name: kumo
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/kumo
      - cp -a . /app/lib/kumo/
      - rm -f /app/lib/kumo/portable /app/lib/kumo/.gitignore
      - mkdir -p /app/bin
      - ln -s /app/lib/kumo/kumo /app/bin/kumo
      - install -Dm644 data/kumo.png /app/share/icons/hicolor/512x512/apps/app.kumo.vpn.png
      - install -Dm644 app.kumo.vpn.desktop /app/share/applications/app.kumo.vpn.desktop
      - install -Dm644 app.kumo.vpn.metainfo.xml /app/share/metainfo/app.kumo.vpn.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/AbolDev/kumo-client/releases/download/v1.9.0/kumo-linux-x64-portable.tar.gz
        sha256: cb79a32b5302583ac639e5218d8f40d354401aa965797cc4e3def1bd72295807
        only-arches: [x86_64]
      - type: archive
        url: https://github.com/AbolDev/kumo-client/releases/download/v1.9.0/kumo-linux-arm64-portable.tar.gz
        sha256: 4396fd2556fa0e588940689b7ad47bdabd025e4aa45d5e7c0458e51e8aedd292
        only-arches: [aarch64]
      - type: file
        path: app.kumo.vpn.desktop
      - type: file
        path: app.kumo.vpn.metainfo.xml