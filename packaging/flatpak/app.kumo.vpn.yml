app-id: app.kumo.vpn
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: kumo
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # the tray icon
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-download
modules:
  - name: kumo
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/kumo
      - cp -a . /app/lib/kumo/
      - rm -f /app/lib/kumo/portable /app/lib/kumo/.gitignore
      - mkdir -p /app/bin
      - ln -s /app/lib/kumo/kumo /app/bin/kumo
      - install -Dm644 data/kumo.png /app/share/icons/hicolor/512x512/apps/app.kumo.vpn.png
      - install -Dm644 app.kumo.vpn.desktop /app/share/applications/app.kumo.vpn.desktop
      - install -Dm644 app.kumo.vpn.metainfo.xml /app/share/metainfo/app.kumo.vpn.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/AbolDev/kumo-client/releases/download/v1.10.0/kumo-linux-x64-portable.tar.gz
        sha256: a6af412966fbdf174b03abd24a145fecebf4f78dfe1f6013aea7ca9232a8371b
        only-arches: [x86_64]
      - type: archive
        url: https://github.com/AbolDev/kumo-client/releases/download/v1.10.0/kumo-linux-arm64-portable.tar.gz
        sha256: 5729c444e6d5cf38ecdf301da924205fcddf3a37b09bde8c953af91b78d514c0
        only-arches: [aarch64]
      - type: file
        path: app.kumo.vpn.desktop
      - type: file
        path: app.kumo.vpn.metainfo.xml