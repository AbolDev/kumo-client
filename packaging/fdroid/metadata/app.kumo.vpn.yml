# DRAFT. The native parts are built by tools/fdroid_build.sh (what .github/workflows/build.yml does for the APK:
# libbox from sing-box, Xray for XHTTP), then flutter build. See packaging/fdroid/README.md for what is tested.
Builds:
  - versionName: 1.7.0
    versionCode: 25
    commit: v1.7.0
    timeout: 14400
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.27.4
      - go@go1.27.3
      - sing-box@v1.13.21
      - xray-core@v26.10.21
    rm:
      # binaries that were committed for convenience: they are built from source below
      - android/app/libs/libbox.aar
      - android/app/src/main/jniLibs
    sudo:
      - apt-get update
      - apt-get install -y golang-go gcc make
    prebuild:
      # the self-updater has no place in this build
      - sed -i '/REQUEST_INSTALL_PACKAGES/d' android/app/src/main/AndroidManifest.xml
      # libbox.aar (sing-box) and the Xray executables, built from source
      - bash tools/fdroid_build.sh $$go$$ $$sing-box$$ $$xray-core$$ $$NDK$$
    build:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter build apk --release --dart-define=FDROID=true

AutoUpdateMode: Version
